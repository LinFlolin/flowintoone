<svg xmlns="http://www.w3.org/2000/svg" width="112" height="42" viewBox="0 0 112 42" role="img" aria-labelledby="loader-title">
  <title id="loader-title">Loading</title>
  <style>
    .dot { animation: bounce 1.2s ease-in-out infinite; }
    .dot:nth-of-type(2) { animation-delay: .2s; }
    .dot:nth-of-type(3) { animation-delay: .4s; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
  <circle class="dot" cx="28" cy="21" r="7" fill="#877499"/>
  <circle class="dot" cx="56" cy="21" r="7" fill="#679F9F"/>
  <circle class="dot" cx="84" cy="21" r="7" fill="#E18299"/>
</svg>
